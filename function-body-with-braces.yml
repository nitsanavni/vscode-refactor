# Usage: sg scan --rule function-body-with-braces.yml --json file.js | jq -r '.[].text'
id: function-body-with-braces
language: javascript
rule:
  all:
    - kind: statement_block
    - inside:
        any:
          - kind: function_declaration
          - kind: function_expression
          - kind: arrow_function
          - kind: method_definition