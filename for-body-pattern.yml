# Usage: sg scan --rule for-body-pattern.yml --json gilded_rose.js | jq '.[] | select(.range.start.line == 13) | .metaVariables.multi.FORBODY[] | .text'
id: for-body-pattern
language: javascript
rule:
  pattern:
    context: for (let i = 0; i < this.items.length; i++) { $$$FORBODY }
    selector: statement_block